<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" aria-labelledby="t d">
<title id="t">Four-switch bidirectional buck-boost topology</title>
<desc id="d">Two synchronous half bridges, Q1/Q4 on the left side and Q2/Q3 on the right side, joined by a 22 uH main inductor, with 2 x 220 uF bulk capacitance at each port.</desc>
<style>
:root{--ink:#24292f;--muted:#57606a;--bg:#ffffff;--accent:#1a7f5f}
@media (prefers-color-scheme:dark){:root{--ink:#e6edf3;--muted:#9198a1;--bg:#0d1117;--accent:#3fb950}}
.w{fill:none;stroke:var(--ink);stroke-width:1.4}
.rc{stroke-linecap:round}
.fp{fill:var(--ink)}
.term{fill:var(--bg);stroke:var(--ink);stroke-width:1.4}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:20px;font-weight:600;fill:var(--ink)}
.th{font-size:14px;font-weight:500;fill:var(--ink)}
.ts{font-size:12px;fill:var(--muted)}
.ac{stroke:var(--accent);stroke-width:1.4;fill:none}
.act{font-size:12px;fill:var(--accent)}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<g id="nmos" class="w">
<path class="rc" d="M-50 0H-32"/>
<path d="M-32 -20V20"/>
<path d="M-24 -20V-10M-24 -4.5V4.5M-24 10V20"/>
<path class="rc" d="M-24 -20H20M0 -20V-34"/>
<path class="rc" d="M-24 20H20M0 20V34"/>
<path d="M-14 0H0M0 0V20"/>
<polygon class="fp" points="-24,0 -13,-4 -13,4" stroke="none"/>
<path d="M20 -20V-6M20 8V20"/>
<polygon class="fp" points="14,8 26,8 20,-6" stroke="none"/>
<path class="rc" d="M14 -6H26"/>
<circle cx="-52" cy="0" r="3" fill="var(--bg)"/>
</g>
</defs>

<text class="h" x="340" y="40" text-anchor="middle">Four-switch bidirectional buck-boost topology</text>

<g class="w rc" transform="translate(0,30)">
<path d="M60 110H225"/>
<path d="M455 110H615"/>
<path d="M60 440H615"/>
<path d="M110 110V264M110 279V440"/>
<path d="M95 264H125M95 279H125"/>
<path d="M585 110V264M585 279V440"/>
<path d="M570 264H600M570 279H600"/>
<path d="M225 110V146"/>
<path d="M455 110V146"/>
<path d="M225 214V326"/>
<path d="M455 214V326"/>
<path d="M225 394V440"/>
<path d="M455 394V440"/>
<path d="M225 270H330"/>
<path d="M410 270H455"/>
<path d="M330 270a10 10 0 0 1 20 0a10 10 0 0 1 20 0a10 10 0 0 1 20 0a10 10 0 0 1 20 0"/>
</g>

<g transform="translate(0,30)">
<use href="#nmos" transform="translate(225,180)"/>
<use href="#nmos" transform="translate(225,360)"/>
<use href="#nmos" transform="translate(455,180) scale(-1,1)"/>
<use href="#nmos" transform="translate(455,360) scale(-1,1)"/>

<g class="fp">
<circle cx="225" cy="270" r="3.5"/>
<circle cx="455" cy="270" r="3.5"/>
<circle cx="225" cy="440" r="3.5"/>
<circle cx="455" cy="440" r="3.5"/>
<circle cx="110" cy="110" r="3.5"/>
<circle cx="110" cy="440" r="3.5"/>
<circle cx="585" cy="110" r="3.5"/>
<circle cx="585" cy="440" r="3.5"/>
</g>

<g class="term">
<circle cx="60" cy="110" r="4.5"/>
<circle cx="615" cy="110" r="4.5"/>
<circle cx="60" cy="440" r="4.5"/>
<circle cx="615" cy="440" r="4.5"/>
</g>

<text class="th" x="60" y="64" text-anchor="middle">Vin</text>
<text class="ts" x="60" y="84" text-anchor="middle">12–48 V</text>
<text class="ts" x="44" y="110" text-anchor="middle" dominant-baseline="central">+</text>
<text class="th" x="615" y="64" text-anchor="middle">Vout</text>
<text class="ts" x="615" y="84" text-anchor="middle">5–48 V</text>
<text class="ts" x="631" y="110" text-anchor="middle" dominant-baseline="central">+</text>
<text class="ts" x="60" y="466" text-anchor="middle">GND</text>
<text class="ts" x="615" y="466" text-anchor="middle">GND</text>

<text class="ts" x="134" y="266">Cin bulk</text>
<text class="ts" x="134" y="282">2 × 220 µF</text>
<text class="ts" x="558" y="266" text-anchor="end">Cout bulk</text>
<text class="ts" x="558" y="282" text-anchor="end">2 × 220 µF</text>

<text class="th" x="266" y="180" dominant-baseline="central">Q1</text>
<text class="th" x="266" y="360" dominant-baseline="central">Q4</text>
<text class="th" x="414" y="180" text-anchor="end" dominant-baseline="central">Q2</text>
<text class="th" x="414" y="360" text-anchor="end" dominant-baseline="central">Q3</text>

<text class="ts" x="164" y="180" text-anchor="end" dominant-baseline="central">PWM1H</text>
<text class="ts" x="164" y="360" text-anchor="end" dominant-baseline="central">PWM1L</text>
<text class="ts" x="507" y="154" text-anchor="middle">PWM2H</text>
<text class="ts" x="507" y="334" text-anchor="middle">PWM2L</text>

<text class="ts" x="370" y="252" text-anchor="middle">L1 22 µH</text>
<text class="ts" x="232" y="296">SW_A</text>
<text class="ts" x="448" y="296" text-anchor="end">SW_B</text>

<text class="ts" x="225" y="492" text-anchor="middle">Left half-bridge · Q1 / Q4</text>
<text class="ts" x="455" y="492" text-anchor="middle">Right half-bridge · Q2 / Q3</text>

<line class="ac" x1="150" y1="520" x2="530" y2="520" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="act" x="340" y="512" text-anchor="middle">Bidirectional power flow</text>
<text class="ts" x="340" y="546" text-anchor="middle">d1 = Q1 high-side duty · d2 = Q3 low-side duty · ideal CCM: Vout/Vin = d1/(1−d2)</text>
<text class="ts" x="340" y="565" text-anchor="middle">fsw 200 kHz · Q1–Q4 BSC070N10NS3G · rated 24 V / 5 A · suggested max 200 W</text>
</g>
</svg>
